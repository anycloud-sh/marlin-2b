name: Build candidate
on:
  push:
    branches: [main]
    paths:
      [
        Dockerfile,
        runtime_setup.py,
        infer.py,
        examples/**,
        .github/workflows/publish.yml,
      ]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: build-candidate
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test real upstream results and invalid inputs
        run: python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: IMAGE_REVISION=${{ github.sha }}
          tags: ghcr.io/anycloud-sh/marlin-2b:candidate-${{ github.sha }}
      - name: Record validation input
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p candidate
          jq -n --arg digest "$DIGEST" --arg source "$GITHUB_SHA" \
            '{digest:$digest,artifact_revision:$source}' > candidate/image.json
      - uses: actions/upload-artifact@v4
        with:
          name: marlin-candidate
          path: candidate/image.json
          retention-days: 30
